<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test an embed in an article · Daily Maverick elections graphics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@400;700&family=Geist:wght@400;600;700&display=swap">
<style>@font-face{font-family:"DM Custom";src:url("fonts/DMCustomMar2026-V2-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
*{box-sizing:border-box}html{background:#F2F2F2}body{margin:0;font-family:Geist,"Helvetica Neue",Arial,sans-serif;color:#171717;-webkit-font-smoothing:antialiased}
a{color:#171717}a:hover{color:#CA2828}
.t-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 24px;border-bottom:1px solid #D4D4D4}
.t-top b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6B6C6D}
.t-seg{display:inline-flex}.t-seg button{height:30px;padding:0 12px;border:1px solid #171717;margin-right:-1px;background:#fff;font:600 12.5px Geist,sans-serif;cursor:pointer}.t-seg button.is-on{background:#171717;color:#fff}
.t-note{flex:1 1 320px;font-size:13px;line-height:1.45;color:#414343;margin:0}
.t-page{background:#fff;margin:24px auto 0;padding:40px 16px 80px;max-width:700px;transition:max-width .2s}
.t-page.is-phone{max-width:375px}
.t-col{max-width:668px;margin:0 auto}
.t-kick{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#CA2828}
.t-h{font-family:"DM Custom",Georgia,serif;font-size:34px;line-height:1.1;margin:8px 0 22px}
.t-lines{display:grid;gap:11px;margin:0 0 28px}.t-lines i{display:block;height:11px;border-radius:2px;background:#EAEAEA}.t-lines i:last-child{width:62%}
.t-embed{margin:0 0 28px}
.t-code{max-width:700px;margin:24px auto 0;padding:0 16px}
.t-code textarea{display:block;width:100%;height:110px;padding:8px 10px;border:1px solid #D4D4D4;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
.t-code button{margin-top:8px;height:32px;padding:0 14px;border-radius:5px;border:1px solid #A61212;background:#CA2828;color:#fff;font:700 12px Geist,sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.t-code p{font-size:13px;line-height:1.5;color:#414343}</style>
</head>
<body>
<div class="t-top"><b>Test in an article</b><span class="t-seg" id="t-w"><button type="button" class="is-on" data-v="d">Desktop article</button><button type="button" data-v="p">Phone</button></span><p class="t-note" id="t-note"></p></div>
<div class="t-page" id="t-page"><div class="t-col"><span class="t-kick">Local government elections 2026</span><div class="t-h">The article&rsquo;s headline</div><div class="t-lines" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="t-embed" id="t-embed"></div><div class="t-lines" aria-hidden="true"><i></i><i></i><i></i></div></div></div>
<div class="t-code"><p>The embed code, as pasted into the article&rsquo;s HTML block. Paste another one here to try it.</p><textarea id="t-src" spellcheck="false" aria-label="Embed code"></textarea><button type="button" id="t-go">Show it in the article</button></div>
<script src="config.js"></script>
<script>
(function () {
  var C = window.EHX_CONFIG || {}, here = location.href.replace(/[#?].*$/, '').replace(/[^\/]*$/, '');
  var local = location.protocol === 'file:' || /(^|\.)claudeusercontent\.com$|^localhost$|^127\.|^10\.|^192\.168\./.test(location.hostname);
  var pub = String(C.publicBase || '').replace(/\/?$/, '/'), src = document.getElementById('t-src'), box = document.getElementById('t-embed');
  var h = /(?:^|&)code=([^&]*)/.exec(location.hash.slice(1));
  src.value = h ? decodeURIComponent(h[1]) : '';
  // the code as an article would run it: the markup, then its scripts (scripts put in with innerHTML don't run by themselves)
  function show() {
    var c = src.value, note = '';
    if (local && pub && c.indexOf(pub) >= 0) { c = c.split(pub).join(here).split(JSON.stringify(new URL(pub).origin)).join(JSON.stringify(location.origin)); note = 'This is a preview copy: the frame loads this copy\u2019s files in place of ' + pub + ', the address the code points at.'; }
    document.getElementById('t-note').textContent = note || 'The frame in the article is the code exactly as pasted.';
    window.__dmEhx = 0;
    box.innerHTML = c;
    [].forEach.call(box.querySelectorAll('script'), function (s) { var n = document.createElement('script'); n.textContent = s.textContent; s.parentNode.replaceChild(n, s); });
  }
  document.getElementById('t-go').addEventListener('click', show);
  document.getElementById('t-w').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    [].forEach.call(b.parentNode.children, function (x) { x.classList.toggle('is-on', x === b); });
    document.getElementById('t-page').classList.toggle('is-phone', b.getAttribute('data-v') === 'p');
  });
  if (src.value) show();
})();
</script>
</body>
</html>
